name: Deploy to Github Pages

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

# 同一分支只保留最新的构建，避免旧版本晚于新版本部署
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            # Give the default GITHUB_TOKEN write permission to commit and push the
            # added or changed files to the repository.
            contents: write

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Cache Hugo resources
              uses: actions/cache@v4
              env:
                  cache-name: cache-hugo-resources
              with:
                  path: resources
                  key: ${{ env.cache-name }}

            - uses: actions/setup-go@v5
              with:
                  go-version: "1.27.1"
            - run: go version

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v2
              with:
                  hugo-version: "0.166.0"
                  extended: true

            - name: Build
              run: hugo --minify --gc

            - name: Check deployment revision
              id: revision
              if: github.event_name == 'push' && github.ref == 'refs/heads/master'
              run: |
                  remote_ref=$(git ls-remote --exit-code origin refs/heads/master)
                  read -r current_sha _ <<< "$remote_ref"
                  if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
                      echo 'current=true' >> "$GITHUB_OUTPUT"
                  else
                      echo 'master 已更新，跳过旧版本部署。'
                  fi

            - name: Deploy 🚀
              if: steps.revision.outputs.current == 'true'
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: gh-pages
                  folder: public
                  clean: true
                  single-commit: true
