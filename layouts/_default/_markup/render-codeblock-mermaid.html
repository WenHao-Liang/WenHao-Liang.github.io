{{/* Mermaid 源码只作为转义后的文本交给浏览器，原始接龙仍由 text 模板处理 */}}
<figure class="weekly-mermaid">
  <div class="weekly-chart-scroll" tabindex="0" role="region" aria-label="打卡天数柱状图，可左右滚动"></div>
  <div class="weekly-chart-controls" role="group" aria-label="柱状图左右移动" hidden>
    <button type="button" data-chart-scroll="start">最左边</button>
    <button type="button" data-chart-scroll="left">左滑一下</button>
    <button type="button" data-chart-scroll="right">右滑一下</button>
    <button type="button" data-chart-scroll="end">最右边</button>
  </div>
  <p class="weekly-chart-status" role="status">正在加载柱状图…</p>
  <details class="weekly-chart-code"><summary>查看图表源码</summary><pre><code>{{ .Inner }}</code></pre></details>
</figure>
