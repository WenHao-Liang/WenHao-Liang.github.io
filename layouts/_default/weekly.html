{{/* 周报使用宽版单栏，标题只出现一次，表格可横向滚动 */}}
{{ define "body-class" }}article-page weekly-page{{ end }}
{{ define "main" }}
<article class="main-article checkin-page">
  <header class="article-header"><div class="article-details">
    {{ with .Site.GetPage (printf "/%s" .Params.group_id) }}<a href="{{ .RelPermalink }}">← {{ .Title }}</a>{{ end }}
    <h1 class="article-title">{{ .Title }}</h1>
  </div></header>
  <section class="article-content">
    <nav class="weekly-toc" aria-label="周报目录">{{ .TableOfContents }}</nav>
    {{ .Content }}
  </section>
</article>
{{ partialCached "footer/footer" . }}
{{ end }}
