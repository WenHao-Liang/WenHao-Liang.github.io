{{/* 资源页面仅显示标题和正文链接 */}}
{{ define "body-class" }}article-page{{ end }}
{{ define "main" }}
<article class="main-article checkin-page">
  <header class="article-header"><div class="article-details">
    <nav aria-label="上一级页面"><a class="parent-link" href="{{ .Site.Home.RelPermalink }}">← 返回博客首页</a></nav>
    <h1 class="article-title">{{ .Title }}</h1>
  </div></header>
  <section class="article-content">{{ .Content }}</section>
</article>
{{ partialCached "footer/footer" . }}
{{ end }}
