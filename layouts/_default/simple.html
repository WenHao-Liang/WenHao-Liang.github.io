{{/* 资源页面仅显示标题和正文链接 */}}
{{ define "body-class" }}article-page{{ end }}
{{ define "main" }}
<article class="main-article checkin-page">
  <header id="article-top" class="article-header"><div class="article-details">
    <nav aria-label="上一级页面"><a class="parent-link" href="{{ .Site.Home.RelPermalink }}">← 返回文集分类</a></nav>
    <h1 class="article-title">{{ .Title }}</h1>
    {{ partial "publication-dates.html" . }}
    {{ partial "visit-statistics.html" (dict "page" . "kind" "page") }}
  </div></header>
  <section class="article-content">{{ .Content }}</section>
  <div id="article-bottom"></div>
</article>
{{ partialCached "footer/footer" . }}
{{ end }}
