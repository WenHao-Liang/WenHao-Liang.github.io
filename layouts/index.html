{{/* 主页按权重自动列出 collection 文集，不展开文章或打卡子页面 */}}
{{ define "main" }}
<header class="portal-heading"><h1>{{ .Title }}</h1></header>
<section class="article-list">
{{ range (where (where .Site.Pages "Params.collection" true) "Params.hidden" "!=" true).ByWeight }}
  <article class="main-article portal-card"><div class="article-details">
    <h2 class="article-title"><a href="{{ .RelPermalink }}">{{ .Title }} <span aria-hidden="true">→</span></a></h2>
  </div></article>
{{ else }}
  <p>暂无文集。</p>
{{ end }}
</section>
{{ partialCached "footer/footer" . }}
{{ end }}
